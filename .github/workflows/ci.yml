name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 11, matching the version that produced pnpm-lock.yaml. pnpm 9
      # rejects this repo's pnpm-workspace.yaml, which carries `allowBuilds`
      # and no `packages` field.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # No `cache: pnpm` — the cache step runs `pnpm store path`, which fails
      # because pnpm-workspace.yaml here carries only `allowBuilds` and no
      # `packages` field. Install is small enough that the cache is not worth
      # changing the workspace file for.
      # Node 22: pnpm 11 needs node:sqlite, which Node 20 does not have. The
      # package's floor stays Node 20 — esbuild bundles with --target=node20,
      # which is what actually guarantees it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # The bundles are committed, because local MCP clients run bin/mcp.cjs from
      # a checkout rather than from npm. A rebuild that never got committed ships
      # stale code to every one of them, so a dirty tree after building is a
      # failure, not a warning.
      - name: Bundles match source
        run: |
          pnpm build
          git diff --exit-code --stat bin/ \
            || { echo "::error::bin/ is stale — run 'pnpm build' and commit the result"; exit 1; }
