# Transitive advisories closed by forcing patched versions upstream has not
# adopted yet. Only packages that actually reach the shipped bundles are listed —
# see reference/security-audit-2026-08.md for how that was determined and why the
# rest are left alone.
# Each range is the smallest patched version, capped inside the major upstream
# already depends on: a bare '>=' pulls the next major (markdown-it 15,
# linkify-it 6) into a code path upstream never tested.
overrides:
  ws: '>=8.21.0 <9'                    # @hcengineering/api-client — the WebSocket transport
  fast-uri: '>=3.1.9 <4'               # ajv, via @modelcontextprotocol/sdk
  linkify-it: '>=5.0.2 <6'             # markdown-it
  markdown-it: '>=14.3.3 <15'          # @hcengineering/text-markdown
  body-parser: '>=2.4.0 <3'            # express
  '@hono/node-server': '>=2.1.3 <3'    # @modelcontextprotocol/sdk (accepts ^1.19.9 || ^2.0.5; 1.x has no fix)
  hono: '>=4.13.16 <5'                 # @hono/node-server 2, @modelcontextprotocol/sdk (^4.11.4)
  proxy-addr: '>=2.0.8 <3'             # express
  qs: '>=6.16.1 <7'                    # body-parser, express
  '@tiptap/core': '2.27.3'             # official v2 backport of GHSA-cp6q-959q-f8rh; @hcengineering/text needs ^2.11.7
  prosemirror-view: '>=1.42.3 <2'      # @tiptap/pm, via @hcengineering/text
  prosemirror-model: '>=1.25.13 <2'    # one copy: prosemirror-view 1.42+ needs it, two copies break schema checks

allowBuilds:
  core-js: false
  esbuild: true
  msgpackr-extract: true
